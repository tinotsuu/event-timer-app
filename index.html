<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer Panggung">
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Timer Panggung</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="setup">
 <div class="wrap">
  <h1>Timer Panggung</h1>
  <p class="sub">Isi nama sesi, durasi, dan keterangan. Lalu tekan <b>Mulai Acara</b>.</p>
  <div id="list"></div>
  <p class="tip">Tips: tambahkan ke Layar Utama lewat Safari (tombol Bagikan → Tambah ke Layar Utama) supaya tampil layar penuh. Di Pengaturan iPad, set Kunci Otomatis ke Tidak Pernah.</p>
 </div>
 <div class="bar"><div class="wrap">
  <button id="add">+ Tambah sesi</button>
  <button id="start" class="go">Mulai Acara</button>
 </div></div>
</div>

<div id="run" class="hidden">
 <div class="top"><span id="pos"></span><span id="clock"></span></div>
 <div id="title"></div>
 <div id="time">00:00</div>
 <div id="note"></div>
 <div class="prog"><div id="pb"></div></div>
 <div id="next"></div>
 <div id="ctl">
  <button id="prev">◀ Sebelumnya</button>
  <button id="m1">−1 menit</button>
  <button id="toggle" class="big">Mulai</button>
  <button id="p1">+1 menit</button>
  <button id="nxt">Berikutnya ▶</button>
  <button id="rst">Ulang sesi</button>
  <button id="hide">Sembunyikan</button>
  <button id="edit">Edit</button>
 </div>
 <button id="show" class="hidden" aria-label="Tampilkan tombol">⋯</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
